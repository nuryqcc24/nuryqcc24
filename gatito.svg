          <path d="M90 21 L 110 -20 Q 112 -22 113 -18 L 121 21 Z" fill="#7c3aed" stroke="#2e1065" stroke-width="2" stroke-linejoin="round"/>
          <path d="M92 15 L 119 15" stroke="#f97316" stroke-width="5"/>
        </g>

        <!-- etiqueta con su nombre -->
